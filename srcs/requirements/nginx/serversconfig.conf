
server {
	listen 443 ssl;
	ssl_certificate /etc/nginx/cert/wordpress.crt;
	ssl_certificate_key /etc/nginx/cert/wordpress.key;
	ssl_protocols TLSv1.3;

	server_name www.abenabde.42.fr abenabde.42.fr;
	root /home/abenabde/data;
	index index.php index.html;

	location ^~ /adminer {
		proxy_pass http://adminer:8080;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
	}

	location / {
		try_files $uri $uri/ /index.php$is_args$args;
	}

	location ~ \.php$ {
		fastcgi_pass wordpress:9000;
		fastcgi_index index.php;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		include fastcgi_params;
	}
}

server{
	listen 443 ssl;
	ssl_certificate /etc/nginx/cert/pizza.crt;
	ssl_certificate_key /etc/nginx/cert/pizza.key;
	ssl_protocols TLSv1.3;

	server_name www.abenabde.pizza.fr abenabde.pizza.fr;
	root /home/abenabde/static_website;
	index index.html;

	location / {
		index static-site.html;
	}
}

server{
	listen 443 ssl;
	ssl_certificate /etc/nginx/cert/game.crt;
	ssl_certificate_key /etc/nginx/cert/game.key;
	ssl_protocols TLSv1.3;

	server_name www.abenabde.game.fr abenabde.game.fr;

	location / {
		root /game_data;
		index index.html;
	}

	location /stream {
		proxy_pass http://game:8042;
		proxy_http_version 1.1;
		proxy_set_header Connection '';
		proxy_buffering off;
		proxy_cache off;
		gzip off;
		proxy_read_timeout 86400s;
	}

	location /inputs {
		proxy_pass http://game:8042;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_buffering off;
		proxy_cache off;
		gzip off;
		proxy_read_timeout 86400s;
	}
}
