
services:
  
  game:
    build:
      context: bonus/game
      dockerfile: Dockerfile
    ports:
      - "8042"
    networks:
      - net_game_stream
    tty: true

  nginx:
    build:
      context: requirements/nginx
      dockerfile: Dockerfile
    volumes:
      - wp-data:/home/abenabde/data
      - static-website:/home/abenabde/static_website
    ports:
      - "443:443"
      - "9000"
    networks:
      - net_front
      - net_nginx_adminer
      - net_game_stream
    restart: unless-stopped
    tty: true

  wordpress:
    build:
      context: requirements/wordpress
      dockerfile: Dockerfile
    environment:
      WP_DB_NAME: ${WP_DB_NAME}
      WP_DB_USER: ${WP_DB_USER}
      WP_DB_PASSWORD: ${WP_DB_PASSWORD}
    hostname: www.abenabde.42.fr
    volumes:
      - wp-data:/home/abenabde/data
    networks:
      - net_front
      - net_wp_db
      - net_wp_cache
    restart: unless-stopped

  mariadb:
    build:
      context: requirements/mariadb
      dockerfile: Dockerfile
    environment:
      MYSQL_DATABASE: ${WP_DB_NAME}
      MYSQL_USER: ${WP_DB_USER}
      MYSQL_PASSWORD: ${WP_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/home/abenabde/data
    networks:
      - net_wp_db
      - net_adminer_db
    restart: unless-stopped

  redis:
    build:
      context: bonus/redis
      dockerfile: Dockerfile
    networks:
      - net_wp_cache
    restart: unless-stopped

  ftp:
    build:
      context: bonus/ftp
      dockerfile: Dockerfile
    environment:
      FTP_USER: ${FTP_USER}
      FTP_PASSWORD: ${FTP_PASSWORD}
    volumes:
      - wp-data:/home/abenabde/data
    ports:
      - "21:21"
      - "30000-30009:30000-30009"
    networks:
      - net_front
    restart: unless-stopped

  adminer:
    build:
      context: bonus/adminer
      dockerfile: Dockerfile
    networks:
      - net_nginx_adminer
      - net_adminer_db
    restart: unless-stopped

volumes:
  wp-data:
  db-data:
  static-website:

networks:
  net_front:
    driver: bridge
  net_wp_db:
    driver: bridge
  net_wp_cache:
    driver: bridge
  net_nginx_adminer:
    driver: bridge
  net_adminer_db:
    driver: bridge
  net_game_stream:
    driver: bridge
