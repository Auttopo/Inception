
services:

  nginx:
    build:
      context: requirements/nginx
      dockerfile: Dockerfile
    volumes:
      - wp-data:/home/abenabde/data
    ports:
      - "443:443"
      - "9000"
    networks:
      - bridge_1
    restart: unless-stopped

  wordpress:
    build:
      context: requirements/wordpress
      dockerfile: Dockerfile
    environment:
      WP_DB_NAME: ${WP_DB_NAME}
      WP_DB_USER: ${WP_DB_USER}
      WP_DB_PASSWORD: ${WP_DB_PASSWORD}
    hostname: www.abenabde.42.fr
    volumes:
      - wp-data:/home/abenabde/data
    networks:
      - bridge_1
      - bridge_2
    restart: unless-stopped

  mariadb:
    build:
      context: requirements/mariadb
      dockerfile: Dockerfile
    environment:
      MYSQL_DATABASE: ${WP_DB_NAME}
      MYSQL_USER: ${WP_DB_USER}
      MYSQL_PASSWORD: ${WP_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/home/abenabde/data
    networks:
      - bridge_2
    restart: unless-stopped
  
volumes:
  wp-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/abenabde/data/wp_data

  db-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/abenabde/data/db_data

networks:
  bridge_1:
    driver: bridge
  bridge_2:
    driver: bridge
